name: Research
description: Track an evidence-producing technical question.
title: ""
labels: ["type: research"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: State the narrow question the research must answer.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence plan
      description: Describe probes, corpora, compilers, controls, or reference implementations.
    validations:
      required: true
  - type: textarea
    id: promotion
    attributes:
      label: Promotion criterion
      description: What result would justify a production change, and what result would reject it?
