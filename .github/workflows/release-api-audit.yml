name: Release API Audit

on:
  push:
    branches:
      - validation/release-0.2-api-audit
  pull_request:
    branches:
      - release/0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API contract (${{ matrix.compiler }})
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.111.0, ldc-1.41.0]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0
          dc_format: shortname

      - name: Package unit tests
        shell: bash
        run: |
          set -euo pipefail
          dub test --compiler="$DC" --force
          DFLAGS="-unittest -preview=dip1000" dub test --compiler="$DC" --force

      - name: External positive API freeze contract
        shell: bash
        run: |
          set -euo pipefail
          dub test             --root=tests/external/raster_api_freeze             --compiler="$DC"             --force
          DFLAGS="-preview=dip1000" dub test --root=tests/external/raster_api_freeze --compiler="$DC" --force

      - name: External negative API surface
        shell: bash
        run: |
          set -euo pipefail
          bash tools/release-api-audit.sh "$DC"

      - name: Ownership/import source contracts
        shell: bash
        run: |
          set -euo pipefail
          tools/compile-negative/raster_owned_resource.sh "$DC"
          tools/compile-negative/raster_import_public.sh "$DC"

      - name: Lifetime/source contracts
        shell: bash
        run: |
          set -euo pipefail
          tools/compile-negative/raster_lifetime.sh "$DC"
          tools/compile-negative/raster_writable_view_lifetime.sh "$DC"

      - name: External retained-import link closure
        shell: bash
        run: |
          set -euo pipefail
          dub test             --root=tests/external/raster_import_link             --compiler="$DC"             --force
          DFLAGS="-preview=dip1000" dub test --root=tests/external/raster_import_link --compiler="$DC" --force
