name: Fast

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 / DMD
            os: ubuntu-24.04
            compiler: dmd-2.111.0
            dub: 1.40.0

          - name: Linux x86-64 / LDC
            os: ubuntu-24.04
            compiler: ldc-1.41.0
            dub: 1.40.0

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: ${{ matrix.dub }}
          dc_format: shortname

      - name: Environment
        shell: bash
        run: |
          echo "Runner OS:         $RUNNER_OS"
          echo "Runner arch:       $RUNNER_ARCH"
          echo "Requested compiler: ${{ matrix.compiler }}"
          echo "DC:                $DC"
          echo

          "$DC" --version
          dub --version

      - name: Build
        shell: bash
        run: |
          dub build --compiler="$DC"

      - name: Test
        shell: bash
        run: |
          dub test --compiler="$DC"

      - name: Generic sum benchmark compile smoke
        shell: bash
        run: |
          dub build \
            --root=benchmark/v0_2_sum \
            --compiler="$DC" \
            --build=release \
            --force

          g++ \
            -O3 \
            -std=c++20 \
            -fno-fast-math \
            -ffp-contract=off \
            -fno-tree-vectorize \
            -fno-tree-slp-vectorize \
            benchmark/v0_2_sum/cpp/reference.cpp \
            -o /tmp/raster-v0-2-sum-cpp-reference

      - name: Raster lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_lifetime.sh "$DC"

      - name: Raster construction lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_construction_lifetime.sh "$DC"

      - name: Raster owned-resource compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_owned_resource.sh "$DC"

      - name: Raster public-import compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_import_public.sh "$DC"

      - name: Generic conversion API compile contracts
        shell: bash
        run: |
          bash tools/compile-negative/raster_conversion_api.sh "$DC"

      - name: Neighbourhood shape compile contracts
        shell: bash
        run: |
          bash tools/compile-negative/raster_neighbourhood_shape_api.sh "$DC"

      - name: Generic neighbourhood compile contracts
        shell: bash
        run: |
          bash tools/compile-negative/raster_neighbourhood_into_api.sh "$DC"

      - name: Border policy compile contracts
        shell: bash
        run: |
          bash tools/compile-negative/raster_border_policy_api.sh "$DC"

      - name: Convolution compile contracts
        shell: bash
        run: |
          bash tools/compile-negative/raster_convolution_api.sh "$DC"

      - name: Prepared convolution benchmark compile smoke
        shell: bash
        run: |
          dub build \
            --root=benchmark/v0_2_prepared_convolution \
            --compiler="$DC" \
            --build=release \
            --force

      - name: Raster retained-import external link probe
        shell: bash
        run: |
          dub test \
            --root=tests/external/raster_import_link \
            --compiler="$DC"

      - name: Raster execution lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_execution_lifetime.sh "$DC"

      - name: Raster target lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_target_lifetime.sh "$DC"

      - name: Raster writable-view lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_writable_view_lifetime.sh "$DC"

      - name: Raster residency internal-surface compile probes
        shell: bash
        run: |
          bash tools/compile-negative/raster_residency_internal.sh "$DC"

      - name: Raster retained-store internal-surface compile probes
        shell: bash
        run: |
          bash tools/compile-negative/raster_retained_store_internal.sh "$DC"

      - name: Raster block-resolution internal-surface compile probes
        shell: bash
        run: |
          bash tools/compile-negative/raster_block_resolution_internal.sh "$DC"

      - name: Raster neighbourhood fast-path internal-surface compile probes
        shell: bash
        run: |
          bash tools/compile-negative/raster_neighbourhood_fast_path_internal.sh "$DC"

      - name: Raster validated-affine relation internal-surface compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_validated_affine_relation_internal.sh "$DC"

      - name: Point-transform executor visibility and trust probes
        shell: bash
        run: |
          tools/compile-negative/raster_transform_dispatch_internal.sh "$DC"
          tools/compile-negative/raster_transform_dispatch_trust.sh "$DC"

      - name: Fill executor visibility and trust probes
        shell: bash
        run: |
          tools/compile-negative/raster_fill_dispatch_internal.sh "$DC"
          tools/compile-negative/raster_fill_dispatch_trust.sh "$DC"

      - name: Copy/conversion visibility, trust and public backing oracle
        shell: bash
        run: |
          tools/compile-negative/raster_copy_conversion_internal.sh "$DC"
          tools/compile-negative/raster_copy_conversion_trust.sh "$DC"
          tools/compile-negative/raster_public_operations.sh "$DC"
          dub run --root=tests/integration/raster_copy_conversion --compiler="$DC" --build=release --force
