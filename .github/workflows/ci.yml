name: Fast

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 / DMD
            os: ubuntu-24.04
            compiler: dmd-2.111.0
            dub: 1.40.0

          - name: Linux x86-64 / LDC
            os: ubuntu-24.04
            compiler: ldc-1.41.0
            dub: 1.40.0

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: ${{ matrix.dub }}
          dc_format: shortname

      - name: Environment
        shell: bash
        run: |
          echo "Runner OS:         $RUNNER_OS"
          echo "Runner arch:       $RUNNER_ARCH"
          echo "Requested compiler: ${{ matrix.compiler }}"
          echo "DC:                $DC"
          echo

          "$DC" --version
          dub --version

      - name: Build
        shell: bash
        run: |
          dub build --compiler="$DC"

      - name: Test
        shell: bash
        run: |
          dub test --compiler="$DC"

      - name: Raster lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_lifetime.sh "$DC"

      - name: Raster construction lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_construction_lifetime.sh "$DC"

      - name: Raster owned-resource compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_owned_resource.sh "$DC"

      - name: Raster public-import compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_import_public.sh "$DC"

      - name: Raster retained-import external link probe
        shell: bash
        run: |
          dub test \
            --root=tests/external/raster_import_link \
            --compiler="$DC"

      - name: Raster execution lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_execution_lifetime.sh "$DC"

      - name: Raster target lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_target_lifetime.sh "$DC"

      - name: Raster writable-view lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_writable_view_lifetime.sh "$DC"

      - name: Raster residency internal-surface compile probes
        shell: bash
        run: |
          bash tools/compile-negative/raster_residency_internal.sh "$DC"

      - name: Raster retained-store internal-surface compile probes
        shell: bash
        run: |
          bash tools/compile-negative/raster_retained_store_internal.sh "$DC"

      - name: Raster block-resolution internal-surface compile probes
        shell: bash
        run: |
          bash tools/compile-negative/raster_block_resolution_internal.sh "$DC"

      - name: Raster neighbourhood fast-path internal-surface compile probes
        shell: bash
        run: |
          bash tools/compile-negative/raster_neighbourhood_fast_path_internal.sh "$DC"

      - name: Raster validated-affine relation internal-surface compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_validated_affine_relation_internal.sh "$DC"

      - name: Point-transform executor visibility and trust probes
        shell: bash
        run: |
          tools/compile-negative/raster_transform_dispatch_internal.sh "$DC"
          tools/compile-negative/raster_transform_dispatch_trust.sh "$DC"

      - name: Fill executor visibility and trust probes
        shell: bash
        run: |
          tools/compile-negative/raster_fill_dispatch_internal.sh "$DC"
          tools/compile-negative/raster_fill_dispatch_trust.sh "$DC"
